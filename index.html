<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#28a745">
</head>
<body>

  <div class="auth-wrapper">
    <div id="loginCard" class="card auth-card">
      <h2 class="app-title">To Do List</h2>
      <p class="app-subtitle">Ingresa para ver y sincronizar tus tareas.</p>

      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
        <input type="password" id="loginPassword" placeholder="Contraseña" required>
        
        <button type="submit" id="loginBtn" class="btn btn-primary">Iniciar sesión</button>
        
        <div class="divider"></div>

        <button type="button" id="showRegisterBtn" class="btn btn-secondary">Crear cuenta nueva</button>
      </form>

      <p id="loginError" class="error-msg"></p>
    </div>

    <div id="registerCard" class="card auth-card" style="display: none;">
      <h2 class="app-title">Crear cuenta</h2>

      <form id="registerForm" class="auth-form">
        <input type="text" id="regName" placeholder="Nombre completo" required>
        <input type="email" id="regEmail" placeholder="Correo electrónico" required>
        <input type="password" id="regPassword" placeholder="Contraseña (mínimo 6 caracteres)" required>
        
        <button type="submit" id="registerBtn" class="btn btn-primary">Registrarte</button>
        
        <div class="divider"></div>

        <button type="button" id="showLoginBtn" class="btn btn-link">¿Ya tienes una cuenta?</button>
      </form>

      <p id="registerError" class="error-msg"></p>
    </div>

    <div id="appContainer" class="card app-card" style="display: none;">
      <div class="app-header">
        <span>Hola, <strong id="userDisplay"></strong></span>
        <button id="logoutBtn" class="btn-logout">Cerrar sesión</button>
      </div>
      
      <h2>Mis Tareas</h2>
      
      <div class="input-container">
        <input type="text" id="taskInput" placeholder="Escribe cualquier texto aquí...">
        <button id="addBtn">Agregar</button>
      </div>
      
      <ul id="taskList"></ul>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
